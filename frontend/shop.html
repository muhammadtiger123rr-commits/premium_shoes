<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop All — AERON</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23121211'/%3E%3Cpath d='M6 24 L14 8h4l-8 16z' fill='%23ff4d1c'/%3E%3Cpath d='M16 24 L22 8h4l-6 16z' fill='%23fff'/%3E%3C/svg%3E">
<script>window.__preStart = performance.now();</script>
</head>
<body data-page="shop">

<div class="preloader" id="preloader">
  <div class="pre-brand">
    <svg class="mark" viewBox="0 0 34 24" aria-hidden="true"><path d="M2 22 L13 2 L18 2 L9.5 22 Z" fill="currentColor"/><path d="M13 22 L21.5 2 L26.5 2 L18 22 Z" fill="#ff4d1c"/><path d="M24 22 L30 8 L33 8 L27.5 22 Z" fill="currentColor"/></svg>
    <span style="animation-delay:.05s">A</span><span style="animation-delay:.1s">E</span><span style="animation-delay:.15s">R</span><span style="animation-delay:.2s">O</span><span style="animation-delay:.25s">N</span>
  </div>
  <div class="pre-bar"><i></i></div>
</div>

<div id="nav-root"></div>

<main id="main">
  <div class="container-wide page-head">
    <p class="crumbs"><a href="index.html">Home</a> <span>/</span> <span>Shop</span></p>
    <h1 class="display">All Shoes</h1>
  </div>

  <div class="container-wide shop-layout">
    <aside class="filters" id="filters">
      <button class="icon-btn filters-close" id="filtersClose" aria-label="Close filters"></button>
      <div class="filter-group">
        <h4>Search</h4>
        <div class="field" style="margin-bottom:0"><input type="search" id="fSearch" placeholder="Search products…"></div>
      </div>
      <div class="filter-group">
        <h4>Category</h4>
        <div class="cat-links" id="fCats"></div>
      </div>
      <div class="filter-group">
        <h4>Size (US)</h4>
        <div class="chip-wrap" id="fSizes"></div>
      </div>
      <div class="filter-group">
        <h4>Color</h4>
        <div class="chip-wrap" id="fColors"></div>
      </div>
      <div class="filter-group">
        <h4>Max price <span class="price-val" id="fPriceVal"></span></h4>
        <input type="range" id="fPrice" min="50" max="250" step="5">
      </div>
      <button class="clear-filters" id="fClear">✕ Clear all filters</button>
    </aside>

    <div class="shop-main">
      <div class="shop-toolbar">
        <button class="btn btn-ghost btn-sm filters-toggle" id="filtersToggle"><span id="filterIcon"></span> Filters</button>
        <span class="results-count" id="resultsCount"></span>
        <select class="sort-select" id="sortSel">
          <option value="featured">Sort: Featured</option>
          <option value="new">Sort: Newest</option>
          <option value="rating">Sort: Top Rated</option>
          <option value="price-asc">Price: Low → High</option>
          <option value="price-desc">Price: High → Low</option>
        </select>
      </div>
      <div class="grid-products" id="grid"></div>
      <div class="load-wrap" id="loadWrap"><button class="btn btn-dark mg" id="loadMore">Load More</button></div>
    </div>
  </div>
</main>

<div id="footer-root"></div>
<div id="modal-root"></div>
<div class="toast-stack" id="toasts"></div>

<script src="assets/js/db.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/shop.js"></script>
</body>
</html>
